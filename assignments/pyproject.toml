[project]
name = "assignments"
version = "0.1.0"
description = "Local and cloud GPU workflow for the CS231n assignments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cython>=3.0",
    "future>=1.0",
    "h5py>=3.10",
    "imageio>=2.34",
    "ipykernel>=6.29",
    "joblib>=1.3",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "nbconvert>=7.0",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pytest>=8.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # openai-clip 1.0.1 imports pkg_resources, removed in setuptools 81.
    "setuptools>=68,<81",
    "six>=1.16",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.optional-dependencies]
assignment3 = [
    "einops>=0.8",
    "opencv-python>=4.9",
    "openai-clip>=1.0.1",
    "thop>=0.1.1",
]
davis = [
    "tensorflow>=2.16",
    "tensorflow-datasets>=4.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cs231n_local*"]

[tool.pytest.ini_options]
pythonpath = ["."]
